data:
    dt: 12
    data_path: "era5_chunked.zarr"
    constant_masks_path: "constant_masks"
    constant_masks : ["soil_type_normalized.npy", "topography_normalized.npy", "sst_mask.npy"]
    normalization_dir: "data/normalization"
    train_subset: -1
    valid_subset: -1
    train_time_range: ["1979-01-01", "2019-12-31"]
    valid_time_range: ["2022-01-01", "2022-12-31"]
    test_time_range: ["2022-01-01", "2022-12-31"]
    prefetch_factor: 1
    num_workers: 4
    n_variables: 84
    n_in_timesteps: 2
    n_out_timesteps: 2
model:
    model_id: "BEAST-JUPITER-0.7B-1.8K"
    qk_norm: True
training:
    tf32: True
    n_samples: 2
    n_epochs: 50
    batch_size: 1 # Can be 2 if model_bayesian=false
    lr_scheduler: True
    low_lr: 0.00001
    normal_lr: 0.0001
    dtype: float32
    autocast: True
    timings: False
    checkpoint_interval: 2000
mesh_dims: [4, -1, 4, 2]
